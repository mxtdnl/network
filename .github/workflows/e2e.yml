name: End-to-end tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  # The suite is split into four shards that run at once (Playwright --shard).
  # Each shard builds the site and serves it itself (playwright.config.ts).
  shard:
    name: playwright (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The slow suites run nightly instead (e2e-nightly.yml).
      - run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/4
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/screenshots/
          if-no-files-found: ignore
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # One check named "playwright", as before sharding, that passes only when
  # every shard passed, and one HTML report merged from the shards.
  playwright:
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Every shard passed
        run: test "${{ needs.shard.result }}" = success
